# ARQUIVO GERADO POR `theme set tokyonight` — NÃO EDITE.
#
# O .tmux.conf versionado traz o comportamento; as cores saem daqui, por um
# source-file. Antes do primeiro `theme set` este arquivo não existe, e o -q
# do source-file deixa o tmux subir do mesmo jeito, só com as cores padrão.
#
# Hex, nunca nome ANSI: no perfil servidor não há ghostty nem alacritty para
# receber a paleta do `theme set`, e o ANSI seria o do terminal de quem conectou.
#
# Os %if são pelas máquinas com tmux mais velho, onde opção inexistente vira erro
# impresso a cada start. Dentro de um %if falso o tmux nem avalia a linha.

# ── Barra de status ───────────────────────────────────────────────────────────
set -g status-style bg="#16161e",fg="#c0caf5"

set-window-option -g window-status-style fg="#9aa5ce"
set-window-option -g window-status-current-style fg="#bb9af7",bg="#292e42",bold
set-window-option -g window-status-last-style fg="#c0caf5"
set-window-option -g window-status-activity-style fg="#e0af68"
set-window-option -g window-status-bell-style fg="#f7768e",bold

# ── Mensagens ─────────────────────────────────────────────────────────────────
# A de comando muda de cor para se distinguir do prompt normal, já que o
# status-keys é vi.
#
# O fill= é necessário: sem ele a mensagem pinta apenas os caracteres que
# escreve, e o resto da linha continua exibindo a barra de status. O efeito fica
# evidente no prefixo numérico do copy mode, cujo texto é curto.
set -g message-style bg="#292e42",fg="#e0af68",fill="#292e42"
set -g message-command-style bg="#292e42",fg="#2ac3de",fill="#292e42"

# ── Copy mode ─────────────────────────────────────────────────────────────────
# O noattr vem do padrão do tmux: sem ele a seleção herda negrito e sublinhado
# do texto que está por baixo.
set-window-option -g mode-style noattr,bg="#292e42",fg="#c0caf5"

%if "#{>=:#{version},3.2}"
set-window-option -g copy-mode-match-style bg="#292e42",fg="#2ac3de"
set-window-option -g copy-mode-current-match-style bg="#7aa2f7",fg="#1a1b26"
set-window-option -g copy-mode-mark-style bg="#3b4261",fg="#c0caf5"
%endif

# O [0/4] herda do mode-style, discreto de propósito por causa da seleção. Da
# 3.6 em diante dá para separar os dois e deixar só ele chamando atenção.
%if "#{>=:#{version},3.6}"
set-window-option -g copy-mode-position-style bg="#292e42",fg="#e0af68"
%endif

# ── Painéis ───────────────────────────────────────────────────────────────────
set-window-option -g pane-border-style fg="#292e42"
set-window-option -g pane-active-border-style "#{?pane_in_mode,fg=#e0af68,#{?synchronize-panes,fg=#f7768e,fg=#7aa2f7}}"

# ── Popups e menus ────────────────────────────────────────────────────────────
%if "#{>=:#{version},3.3}"
set -g popup-style bg="#1a1b26",fg="#c0caf5"
set -g popup-border-style fg="#7aa2f7",bg="#1a1b26"
%endif

%if "#{>=:#{version},3.4}"
set -g menu-style bg="#16161e",fg="#c0caf5"
set -g menu-selected-style bg="#292e42",fg="#bb9af7",bold
set -g menu-border-style fg="#7aa2f7",bg="#16161e"
%endif

# ── Miudezas ──────────────────────────────────────────────────────────────────
set-window-option -g clock-mode-colour "#7aa2f7"
set -g display-panes-colour "#565f89"
set -g display-panes-active-colour "#7aa2f7"
