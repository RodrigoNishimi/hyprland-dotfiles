# conf/colors.conf é gerado por `theme set` (cores, $shadow e $wallpaper).
source = $HOME/.config/hypr/conf/colors.conf

# Os dois papéis de texto do "Hyprland Rice Kit" (seção 06):
# UI/MONO na interface, DISPLAY no relógio grande.
$font = JetBrainsMono Nerd Font
$display = Chakra Petch Light

# A composição separa informação (relógio/data) de ação (autenticação)
# e mantém os elementos centrais diretamente sobre o wallpaper.

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

animations {
    enabled = true
    bezier = snap, 0.05, 0.9, 0.1, 1.05
    animation = fade, 1, 4, snap
    animation = inputFieldDots, 1, 2, snap
}

# ── Fundo ─────────────────────────────────────────────────────────────────────
background {
    monitor =
    path = $wallpaper
    color = $base

    # Mesmo blur das janelas (ver conf/appearance.lua), bem mais escuro para o
    # texto ter contraste com qualquer wallpaper.
    blur_passes = 3
    blur_size = 8
    brightness = 0.48
    contrast = 0.95
    noise = 0.014
    vibrancy = 0.20
}

# ── Etiqueta de estado ────────────────────────────────────────────────────────
label {
    monitor =
    text = ● SESSÃO BLOQUEADA
    color = $subtle
    font_size = 12
    font_family = $font

    position = 56, -44
    halign = left
    valign = top
}

# ── Relógio ───────────────────────────────────────────────────────────────────
# O shadow_color é o acento puro: com 4 passes ele vira brilho, não sombra.
label {
    monitor =
    text = cmd[update:30000] echo "$(date +"%H:%M")"
    color = $text
    font_size = 156
    font_family = $display

    shadow_passes = 3
    shadow_size = 9
    shadow_color = $accent

    position = 0, 235
    halign = center
    valign = center
}

# ── Data ──────────────────────────────────────────────────────────────────────
# O formato depende de LC_TIME; com pt_BR sai "SEGUNDA-FEIRA · 25 JULHO".
label {
    monitor =
    text = cmd[update:43200000] echo "$(date +"%A · %d %B" | tr '[:lower:]' '[:upper:]')"
    color = $subtle
    font_size = 14
    font_family = $font

    shadow_passes = 2
    shadow_size = 3
    shadow_color = $shadow

    position = 0, 120
    halign = center
    valign = center
}

# ── Avatar ────────────────────────────────────────────────────────────────────
image {
    monitor =
    # A mesma foto quadrada usada no menu do usuário do Eww. Além de evitar
    # duas fontes, o formato 1:1 faz o rounding máximo resultar num círculo.
    path = ~/.config/eww/pfp.jpg
    size = 100
    rounding = -1
    border_size = 2
    border_color = $accent

    shadow_passes = 2
    shadow_size = 4
    shadow_color = $shadow

    position = 0, 0
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = $text
    font_size = 14
    font_family = $font

    shadow_passes = 2
    shadow_size = 3
    shadow_color = $shadow

    position = 0, -70
    halign = center
    valign = center
}

# ── Campo de senha ────────────────────────────────────────────────────────────
# Cantos arredondados, mas sem transformar o campo em uma pílula completa.
input-field {
    monitor =
    size = 420, 54
    rounding = 16
    outline_thickness = 1

    outer_color = $accent
    inner_color = $surface
    font_color = $text
    check_color = $accentAlt
    fail_color = $red
    capslock_color = $yellow

    # Fração da altura do campo. O hyprlock aceita de 0.2 a 0.8.
    dots_size = 0.2
    dots_spacing = 0.36
    dots_center = true
    dots_rounding = -1

    fade_on_empty = false
    placeholder_text = <span foreground="##$mutedAlpha">senha</span>
    fail_text = <span foreground="##$textAlpha">$ATTEMPTS tentativa(s)</span>
    hide_input = false

    shadow_passes = 3
    shadow_size = 8
    shadow_color = $shadow

    position = 0, -145
    halign = center
    valign = center
}

# O hyprlock não tem slots para adornos dentro do input; estes labels ficam
# sobre a caixa, mas fora da área central reservada à senha e aos dots.
label {
    monitor =
    # O espaço fino final amplia a textura Pango para preservar o lado direito
    # do glifo Nerd Font; sem ele, o hyprlock recorta o limite do desenho.
    text =  
    color = $muted
    font_size = 14
    font_family = $font

    # Recuo de 42px em relação à borda do campo.
    position = -168, -145
    halign = center
    valign = center
}

label {
    monitor =
    text = ↵
    color = $muted
    font_size = 16
    font_family = $font

    position = 180, -145
    halign = center
    valign = center
}

# ── Rodapé ────────────────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:30000] $HOME/.config/hypr/scripts/lock-footer.sh
    color = $subtle
    font_size = 11
    font_family = $font

    position = 0, 36
    halign = center
    valign = bottom
}
