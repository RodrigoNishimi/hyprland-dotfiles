# Dedicated idle timer, started when Hyprland reports the session locked.
general {
    ignore_dbus_inhibit = true
    ignore_systemd_inhibit = true
    ignore_wayland_inhibit = true
    inhibit_sleep = 0
}

listener {
    timeout = 30
    ignore_inhibit = true
    on-timeout = pidof hyprlock >/dev/null && hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}
