# ARQUIVO GERADO POR `theme set tokyonight` — NÃO EDITE.
# Usado pelo hyprlock (que só entende a sintaxe nativa do Hyprland).

$wallpaper = @@ASSETS@@/wallpapers/tropical-beach.jpeg

$base    = rgb(1a1b26)
$surface = rgb(16161e)
$overlay = rgb(292e42)

$muted  = rgb(565f89)
$subtle = rgb(9aa5ce)
$text   = rgb(c0caf5)

$red     = rgb(f7768e)
$green   = rgb(9ece6a)
$yellow  = rgb(e0af68)
$blue    = rgb(7aa2f7)
$magenta = rgb(bb9af7)
$cyan    = rgb(7dcfff)

$accent    = rgb(7aa2f7)
$accentAlt = rgb(bb9af7)

# Sombra para texto sobre o wallpaper, no tom do fundo do tema.
$shadow = rgba(1a1b26b3)

# Sem o rgb(), para interpolar dentro de markup pango.
$baseAlpha      = 1a1b26
$surfaceAlpha   = 16161e
$textAlpha      = c0caf5
$mutedAlpha     = 565f89
$accentAlpha    = 7aa2f7
$accentAltAlpha = bb9af7
