# ARQUIVO GERADO POR `theme set tokyonight` — NÃO EDITE.
# O starship não suporta include, então o arquivo inteiro é gerado: edite
# themes/templates/starship.toml.in e rode `theme reload`.

add_newline = true
command_timeout = 200
continuation_prompt = '[❯❯](yellow) '
format = " [$python$directory$git_branch$git_status]($style)$line_break $character"

palette = "tokyonight"

[palettes.tokyonight]
base    = "#1a1b26"
surface = "#16161e"
overlay = "#292e42"
muted   = "#565f89"
subtle  = "#9aa5ce"
text    = "#c0caf5"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#e0af68"
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7dcfff"
accent  = "#7aa2f7"
success = "#9ece6a"
warning = "#e0af68"
error   = "#f7768e"
info    = "#2ac3de"

[character]
error_symbol = "[✗](bold error)"
success_symbol = "[❯](bold yellow)"

[python]
format = "[$symbol$virtualenv]($style) "
style = "italic muted"
symbol = ""

detect_extensions = []
detect_files = []
detect_folders = []

[directory]
use_logical_path = false
truncation_length = 2
truncation_symbol = "…/"
style = "bold blue"
repo_root_style = "bold green"
read_only_style = "muted"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$branch]($style) "
style = "magenta"

[git_status]
format     = "([$all_status]($style) )"
style      = "cyan"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = "[](muted) "
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""

[profiles]
transient = "$character"
